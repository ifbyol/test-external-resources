deploy:
  image: okteto/pipeline-runner:v1.0.9
  commands:
    - name: "Generate SQS URL"
      command: |
        export SQS_QUEUE_URL="https://fake-$(openssl rand -hex 8).lambda-url.us-east-1.on.aws.aggregator"
        echo "SQS_QUEUE_URL=$SQS_QUEUE_URL" >> $OKTETO_ENV
    - name: "Update notes.md with env vars"
      command: envsubst < notes.md > notes.md.tmp && mv notes.md.tmp notes.md
    - name: "Script"
      command: echo "Doing something fancy"
      
destroy:
  image: okteto/pipeline-runner:1.0.0
  commands:
    - name: "Destroy something"
      command: echo "Destroying something important..."
    - name: "Destroy other thing"
      command: echo "Destroying something else...."


external:
  sqs:
    icon: storage
    notes: notes.md
    endpoints:
    - name: queue
      url: https://fake-id.lambda-url.us-east-1.on.aws.aggregator

dev:
  hello-world:
    image: okteto/golang:1
    command: bash
    sync:
      - .:/usr/src/app
    volumes:
      - /go
      - /root/.cache
    securityContext:
      capabilities:
        add:
          - SYS_PTRACE
    forward:
      - 2345:2345
